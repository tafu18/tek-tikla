name: 👆 Tek Tıkla Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build Profili Seçin'
        required: true
        default: 'preview'
        type: choice
        options:
        - preview
        - production
        - development

jobs:
  build:
    name: TekTıkla - ${{ inputs.profile }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Repo Checkout
        uses: actions/checkout@v4

      - name: ☕ Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # HATA ÇIKARAN GRADLE ADIMI KALDIRILDI
      # EAS Build kendi içinde ./gradlew kullanarak doğru versiyonu çekecektir.

      - name: 📦 Bağımlılıkları Yükle
        run: |
          npm install -g eas-cli
          npm install

      - name: 🚀 EAS Build Başlat
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          EXT="apk"
          if [ "${{ inputs.profile }}" = "production" ]; then
            EXT="aab"
          fi
      
          npx eas-cli build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --local \
            --non-interactive \
            --output ./tektikla.$EXT

      - name: 🕒 Tarih ve Saati Al
        id: date
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: 📂 TekTıkla-${{ inputs.profile }} (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TekTıkla-${{ inputs.profile }}-${{ env.TIMESTAMP }}-APK
          path: ./tektikla.*

          retention-days: 5
